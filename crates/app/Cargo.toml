[package]
name = "oxide-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
oxide-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
log.workspace = true
env_logger = "0.11"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland", "accesskit", "default_fonts"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
raw-window-handle = "0.6"
global-hotkey = "0.8"
rfd = "0.17"
trash = "5"
open = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_Threading"] }
tray-icon = { version = "0.26", default-features = false }

[lints]
workspace = true
