[package]
name = "oxide-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local notes and OCR-searchable screenshots"
homepage = "https://github.com/DrunkTrader/oxide"
repository = "https://github.com/DrunkTrader/oxide"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
image.workspace = true
oxide-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
log.workspace = true
env_logger = "0.11"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "x11", "wayland", "accesskit", "default_fonts"] }
winit = { version = "0.30", default-features = false, features = ["x11", "wayland", "rwh_06"] }
raw-window-handle = "0.6"
global-hotkey = "0.8"
rfd = "0.17"
trash = "5"
open = "5"
arboard = { version = "3", default-features = false, features = ["image-data"] }
getrandom = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_Threading"] }
tray-icon = { version = "0.26", default-features = false }

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"

# Linux packages built by .github/workflows/release.yml (cargo-deb, cargo-generate-rpm).
# winit and glow dlopen the X11/GL libraries at runtime, so they are listed explicitly:
# the packaging tools only see libraries the binaries link directly.
[package.metadata.deb]
name = "oxide"
maintainer = "DrunkTrader <DrunkTrader@users.noreply.github.com>"
copyright = "2026, DrunkTrader"
license-file = ["../../LICENSE", "0"]
extended-description = "A local native workspace for notes and screenshots whose text is recognized on-device and searchable. No account, no cloud."
section = "utils"
priority = "optional"
depends = "$auto, libxkbcommon-x11-0, libx11-xcb1, libxcursor1, libxi6, libgl1, libegl1"
assets = [
  ["target/release/oxide-app", "usr/bin/", "755"],
  ["target/release/oxide-worker", "usr/bin/", "755"],
  ["../../packaging/linux/oxide.desktop", "usr/share/applications/", "644"],
  ["../../assets/icon.png", "usr/share/icons/hicolor/256x256/apps/oxide.png", "644"],
  ["../../README.md", "usr/share/doc/oxide/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "oxide"
summary = "Local notes and OCR-searchable screenshots"
assets = [
  { source = "target/release/oxide-app", dest = "/usr/bin/oxide-app", mode = "755" },
  { source = "target/release/oxide-worker", dest = "/usr/bin/oxide-worker", mode = "755" },
  { source = "../../packaging/linux/oxide.desktop", dest = "/usr/share/applications/oxide.desktop", mode = "644" },
  { source = "../../assets/icon.png", dest = "/usr/share/icons/hicolor/256x256/apps/oxide.png", mode = "644" },
  { source = "../../LICENSE", dest = "/usr/share/licenses/oxide/LICENSE", mode = "644", doc = true },
]

# Capabilities by soname work across Fedora, RHEL and openSUSE, whose package names differ.
[package.metadata.generate-rpm.requires]
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libX11-xcb.so.1()(64bit)" = "*"
"libXcursor.so.1()(64bit)" = "*"
"libXi.so.6()(64bit)" = "*"
"libGL.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"

