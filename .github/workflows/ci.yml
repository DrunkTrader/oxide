name: Native checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup update stable && rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build native applications
        run: cargo build --workspace --locked
      - name: Real local OCR pipeline
        run: cargo run -p oxide-worker --example pipeline_smoke --locked -- "$RUNNER_TEMP/oxide-pipeline"
        shell: bash
      - name: Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libxtst6 libxkbcommon0 libegl1 libgl1-mesa-dri ffmpeg x11-utils x11-xserver-utils
      - name: Native GUI workflow
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" python3 tests/gui_smoke.py
      - name: Windows GUI starts
        if: runner.os == 'Windows'
        run: |
          $app = Start-Process .\target\debug\oxide-app.exe -ArgumentList @('--data-dir', "$env:RUNNER_TEMP\oxide-ui", '--no-worker', '--smoke-ui') -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Native GUI exited with $($app.ExitCode)" }
